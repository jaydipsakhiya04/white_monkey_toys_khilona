# Local infrastructure + API.
#   docker compose up -d db          # PostgreSQL only (then run apps with npm)
#   docker compose up -d --build     # PostgreSQL + API
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khilona
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khilona"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./khilona_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: http://localhost:4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/khilona?schema=public
      # Replace with a long random secret in real deployments
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-secret-value}
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      COOKIE_SECURE: "false"
      SWAGGER_ENABLED: "true"
      STORAGE_PROVIDER: local
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
